<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizer</title>
    <script>
      // Theme before the first paint (same rule as src/ui/themes.ts loadPrefs): the mode is
      // always the system colour scheme on load. main.ts re-applies it.
      (function () {
        var mode = 'light', theme = 'te';
        try { if (matchMedia('(prefers-color-scheme: dark)').matches) mode = 'dark'; } catch (e) {}
        try {
          var p = JSON.parse(localStorage.getItem('visualizer.ui.v2') || '{}');
          if (p.theme === 'te') theme = p.theme;
        } catch (e) {}
        document.documentElement.dataset.theme = theme + '-' + mode;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
